name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Test (Core + Data)
        run: dotnet test tests/DesktopBoard.Tests -c Release --nologo

      - name: Build app (Release x64)
        run: dotnet build src/DesktopBoard.App -c Release -p:Platform=x64 --nologo
